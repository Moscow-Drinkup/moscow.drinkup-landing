name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Типы
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Stylelint
        run: pnpm lint:css

      - name: Архитектура FSD
        run: pnpm lint:fsd

      - name: Форматирование
        run: pnpm format:check

      - name: Сборка
        run: pnpm build
