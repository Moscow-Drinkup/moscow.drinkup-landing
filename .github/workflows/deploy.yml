name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Публикация идёт в ветку gh-pages, а не через actions/deploy-pages:
# в той же ветке лежат превью пул-реквестов (папка pr-preview), а источник
# у GitHub Pages может быть только один.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          # Старые файлы сайта вычищаются, но превью открытых
          # пул-реквестов остаются на месте
          clean: true
          clean-exclude: |
            pr-preview/
      - name: Ping IndexNow (Bing, Yandex)
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"drinkup.moscow","key":"0b9166b8-ca99-4742-a1a6-27346a467371","keyLocation":"https://drinkup.moscow/0b9166b8-ca99-4742-a1a6-27346a467371.txt","urlList":["https://drinkup.moscow/","https://drinkup.moscow/events","https://drinkup.moscow/venues","https://drinkup.moscow/partners"]}'
